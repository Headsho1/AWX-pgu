---
- name: Linux-Clients aktualisieren
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Bei true wird automatisch neu gestartet, wenn ein Update das verlangt
    auto_reboot: true

  tasks:
    - name: Paketlisten aktualisieren (apt update)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Verfügbare Updates ermitteln
      ansible.builtin.command: apt list --upgradable
      register: upgradable
      changed_when: false

    - name: Liste der verfügbaren Updates aufbereiten
      ansible.builtin.set_fact:
        update_liste: "{{ upgradable.stdout_lines | select('search', '/') | list }}"

    - name: Verfügbare Updates anzeigen
      ansible.builtin.debug:
        msg: "{{ update_liste if update_liste | length > 0 else 'Keine Updates verfügbar – System ist aktuell.' }}"

    - name: Updates installieren (apt dist-upgrade)
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: update_liste | length > 0

    - name: Prüfen, ob ein Neustart nötig ist
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Hinweis zum Neustart
      ansible.builtin.debug:
        msg: >-
          {{ 'Neustart erforderlich' ~ (' – wird jetzt durchgeführt.' if auto_reboot else ' – bitte manuell neu starten.')
             if reboot_required.stat.exists else 'Kein Neustart erforderlich.' }}

    - name: Neustart durchführen (falls nötig)
      ansible.builtin.reboot:
        msg: "Neustart nach Updates durch Ansible AWX"
        reboot_timeout: 600
      when:
        - reboot_required.stat.exists
        - auto_reboot | bool
