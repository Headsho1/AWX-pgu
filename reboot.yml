
---
- name: Linux Mint Clients neustarten
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Neustart durchführen
      ansible.builtin.reboot:
        msg: "Geplanter Neustart durch AWX Patch-Management"
        reboot_timeout: 600
        connect_timeout: 10
        post_reboot_delay: 15
