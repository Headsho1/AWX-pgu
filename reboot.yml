---
- name: Linux-Clients neu starten
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Rechner neu starten und warten, bis er wieder erreichbar ist
      ansible.builtin.reboot:
        msg: "Neustart durch Ansible AWX"
        pre_reboot_delay: 0
        reboot_timeout: 600
        test_command: uptime

    - name: Uptime nach dem Neustart anzeigen
      ansible.builtin.command: uptime
      register: uptime_result
      changed_when: false

    - name: Ergebnis ausgeben
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ist wieder online: {{ uptime_result.stdout }}"
